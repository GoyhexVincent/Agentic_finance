[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sma92-options-lab"
version = "0.1.0"
description = "Laboratoire Monte Carlo et données d'options SMA Solar (Saxo SIM)"
readme = "README_SMA92.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sma92-mc = "sma92.cli_mc:main"
sma92-saxo = "sma92.cli_saxo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
